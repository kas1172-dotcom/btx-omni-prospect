app = "btx-omni-prospect"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[deploy]
  release_command = "uv run alembic upgrade head"

[env]
  BTX_ENVIRONMENT = "production"
  BTX_DATA_MODE = "SAMPLE"
  BTX_API_PREFIX = "/api"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"
