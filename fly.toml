app = "btx-omni-prospect"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[deploy]
  release_command = "uv run alembic upgrade head"

[env]
  BTX_ENVIRONMENT = "production"
  BTX_DATA_MODE = "SAMPLE"
  BTX_API_PREFIX = "/api"
  BTX_FRONTEND_ORIGINS = "https://btx-omni-prospect.vercel.app"
  BTX_MONITOR_MODE = "live"
  BTX_MONITOR_DURABLE_STATE_ENABLED = "true"
  BTX_AI_PROVIDER = "gemini"
  BTX_GEMINI_MODEL = "gemini-3.6-flash"
  BTX_GEMINI_MODE = "vertex"
  BTX_GOOGLE_CLOUD_LOCATION = "global"
  # Runtime enablement is intentionally secret-managed and only works when
  # the backend is production + SAMPLE. CONNECTED data cannot use this path.
  BTX_HOSTED_DEMO_ACCESS_BYPASS = "false"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"
