services:
  postgres:
    image: postgres:16
    container_name: btx-omni-postgres
    environment:
      POSTGRES_DB: btx_omni
      POSTGRES_USER: btx_omni
      POSTGRES_PASSWORD: btx_omni_dev
    ports:
      - "5432:5432"
    volumes:
      - btx_omni_postgres_data:/var/lib/postgresql/data

volumes:
  btx_omni_postgres_data: