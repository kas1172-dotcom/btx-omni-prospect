name: POC CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: btx_omni
          POSTGRES_USER: btx_omni
          POSTGRES_PASSWORD: btx_omni_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U btx_omni -d btx_omni"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      BTX_DATABASE_URL: postgresql+psycopg://btx_omni:btx_omni_dev@localhost:5432/btx_omni
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run alembic upgrade head
      - run: uv run alembic current
      - run: >-
          uv run python -c "from btx_omni.app import app;
          schema = app.openapi();
          assert '/api/health' in schema['paths'];
          print('OpenAPI health route verified')"
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
