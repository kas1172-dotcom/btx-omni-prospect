[project]
name = "btx-omni"
version = "0.1.0"
description = "BTX Omni Prospect backend"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "google-genai>=1.0,<2.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "btx_omni"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/btx_omni/api/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]
